<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" width="1200" height="20" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dv-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ff00d9" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#ff00d9" stop-opacity="0.9"/>
      <stop offset="0.5"  stop-color="#00ffe7" stop-opacity="1"/>
      <stop offset="0.75" stop-color="#ff00d9" stop-opacity="0.9"/>
      <stop offset="1"    stop-color="#ff00d9" stop-opacity="0"/>
    </linearGradient>
    <filter id="dv-glow" x="-5%" y="-200%" width="110%" height="500%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="0" y1="10" x2="1200" y2="10" stroke="url(#dv-line)" stroke-width="1.6" filter="url(#dv-glow)"/>
  <circle cx="600" cy="10" r="3.5" fill="#fff8e7">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
